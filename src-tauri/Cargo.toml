[package]
name = "dlss-image-studio"
version = "0.2.0"
description = "Windows image studio with native D3D12 processing"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "exr"] }
arboard = "3"
rayon = "1"
exr = "1"
moxcms = { version = "0.8", features = ["extended_range"] }
tiff = "0.11"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
