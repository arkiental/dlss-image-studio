name: Bug report
description: Report a reproducible Studio problem
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Steps, expected behavior, actual behavior, and exact error text.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Studio version, Windows, GPU/driver, runtime version if applicable, image format/dimensions/bit depth.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or a minimal sample
      description: Remove private content. Do not attach runtime binaries, secrets or confidential renders.
