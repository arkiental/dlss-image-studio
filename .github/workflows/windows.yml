name: Windows builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: UI request ordering and failure checks (synthetic transport)
        shell: pwsh
        run: |
          $server = Start-Process -FilePath (Get-Command node).Source -ArgumentList 'node_modules/vite/bin/vite.js','--host','127.0.0.1' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            node scripts/preview-race-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'UI race checks failed' }
            node scripts/studio-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Workspace UI checks failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DLSS-Image-Studio-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/dlss-image-studio.exe
            THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-test
          path: src-tauri/target/**/native_smoke.exe
