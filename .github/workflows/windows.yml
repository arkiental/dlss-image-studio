name: Windows builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: UI request ordering and failure checks (synthetic transport)
        shell: pwsh
        run: |
          $server = Start-Process -FilePath (Get-Command node).Source -ArgumentList 'node_modules/vite/bin/vite.js','--host','127.0.0.1' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            node scripts/preview-race-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'UI race checks failed' }
            node scripts/studio-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Workspace UI checks failed' }
            node scripts/lut-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'LUT UI checks failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - name: Package consumer downloads
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DLSS-Image-Studio-Windows-x64
          path: |
            release/*-Setup.exe
            release/*-Portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-test
          path: src-tauri/target/**/native_smoke.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DLSS-Image-Studio-Windows-x64
          path: release
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "DLSS Image Studio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
